name: story-stage-tommy
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: story_stage
      MYSQL_USER: story
      MYSQL_PASSWORD: local_story_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - story_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  story_mysql:
